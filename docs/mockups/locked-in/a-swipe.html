<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked In — Swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0c; --fg:#f4f1ea; --muted:#9a96a3; --accent:#ff3d81; --line:#ffffff1a; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); font-family:"Space Grotesk",sans-serif; }
  body { overflow:hidden; }

  /* The feed: one reel per screen, snap-scrolled like the app. */
  .feed { height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  .feed::-webkit-scrollbar { display:none; }
  .slide { height:100dvh; scroll-snap-align:start; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:clamp(24px,4vw,64px); padding:4vh 24px; position:relative; }

  .meta { justify-self:end; max-width:420px; text-align:right; }
  .rank { font-family:Anton; font-size:clamp(120px,16vw,260px); line-height:.8; color:transparent; -webkit-text-stroke:2px var(--accent); }
  .title { font-family:Anton; text-transform:uppercase; font-size:clamp(32px,3.6vw,56px); line-height:.95; margin-top:20px; }
  .cap { color:var(--muted); font-size:18px; line-height:1.45; margin-top:14px; }
  .date { color:var(--muted); font-size:16px; margin-top:18px; }
  .date b { color:var(--accent); font-weight:500; }

  .phone { height:88dvh; aspect-ratio:9/16; border-radius:28px; overflow:hidden; position:relative; background:#000; box-shadow:0 0 0 1px var(--line), 0 30px 120px -20px #ff3d8155; cursor:pointer; }
  .phone video { width:100%; height:100%; object-fit:cover; display:block; }
  .phone .sound { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); padding:12px 20px; border-radius:999px; background:#000a; backdrop-filter:blur(8px); font-size:16px; transition:opacity .3s; white-space:nowrap; }
  .phone.unmuted .sound { opacity:0; }

  .stats { justify-self:start; display:flex; flex-direction:column; gap:28px; }
  .stat { font-family:Anton; font-size:clamp(40px,4vw,64px); line-height:1; }
  .stat span { display:block; font-family:"Space Grotesk"; font-size:16px; color:var(--muted); margin-top:6px; }
  .ig { display:inline-flex; align-items:center; min-height:56px; padding:0 22px; border:1px solid var(--accent); color:var(--accent); text-decoration:none; font-size:17px; border-radius:999px; transition:background .2s,color .2s; }
  .ig:hover { background:var(--accent); color:var(--bg); }

  /* Intro slide */
  .intro { grid-template-columns:1fr; justify-items:center; text-align:center; }
  .intro h1 { font-family:Anton; text-transform:uppercase; font-size:clamp(64px,12vw,200px); line-height:.86; }
  .intro h1 em { font-style:normal; color:var(--accent); }
  .intro p { color:var(--muted); font-size:20px; margin-top:28px; }
  .hint { margin-top:48px; font-size:17px; color:var(--fg); opacity:.7; animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(8px); } }

  /* Rail: the twelve, always visible — jump anywhere. */
  .rail { position:fixed; right:20px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:5; }
  .rail button { width:44px; height:44px; border-radius:10px; overflow:hidden; border:2px solid transparent; padding:0; cursor:pointer; opacity:.45; background:#111; transition:opacity .2s,border-color .2s,transform .2s; }
  .rail button img { width:100%; height:100%; object-fit:cover; display:block; }
  .rail button:hover { opacity:.85; transform:scale(1.08); }
  .rail button.on { opacity:1; border-color:var(--accent); }

  .progress { position:fixed; left:0; top:0; height:3px; background:var(--accent); z-index:6; transition:width .4s; }

  @media (max-width: 860px) {
    .slide { grid-template-columns:1fr; padding:0; gap:0; }
    .phone { height:100dvh; width:100%; aspect-ratio:auto; border-radius:0; box-shadow:none; }
    .meta, .stats { position:absolute; z-index:2; pointer-events:none; }
    .meta { left:16px; right:76px; bottom:84px; text-align:left; justify-self:auto; }
    .rank { font-size:96px; }
    .title { font-size:34px; margin-top:8px; }
    .cap { color:#ddd; font-size:16px; }
    .stats { right:16px; bottom:84px; gap:16px; }
    .stats .stat { font-size:28px; text-align:right; }
    .stats .ig { display:none; }
    .rail { display:none; }
    .slide:not(.intro)::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 50%, #000c); pointer-events:none; }
    .intro { padding:16px; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<nav class="rail" id="rail" aria-label="The twelve"></nav>
<main class="feed" id="feed">
  <section class="slide intro">
    <div>
      <h1>The best<br><em>twelve.</em></h1>
      <p>@li_locked.in, ranked by plays. Scroll like it's the app.</p>
      <div class="hint">Swipe up ↓</div>
    </div>
  </section>
</main>
<script src="reels.js"></script>
<script>
  const feed = document.getElementById("feed"), rail = document.getElementById("rail");
  let unmuted = false;

  REELS.forEach((r, i) => {
    const s = document.createElement("section");
    s.className = "slide"; s.id = r.slug;
    s.innerHTML = `
      <div class="meta">
        <div class="rank">${String(i + 1).padStart(2, "0")}</div>
        <h2 class="title">${r.title}</h2>
        <p class="cap">“${r.caption}”</p>
        <p class="date"><b>Day ${r.day}</b>, ${r.date}</p>
      </div>
      <div class="phone">
        <video src="${VID}${r.slug}.mp4" poster="${VID}${r.slug}.jpg" muted playsinline loop preload="none"></video>
        <div class="sound">Tap for sound</div>
      </div>
      <div class="stats">
        <div class="stat">${r.views}<span>plays</span></div>
        <div class="stat">${r.likes}<span>likes</span></div>
        <a class="ig" href="https://www.instagram.com/reel/${r.code}/" target="_blank" rel="noreferrer">Open on Instagram ↗</a>
      </div>`;
    feed.appendChild(s);

    const b = document.createElement("button");
    b.title = r.title; b.innerHTML = `<img src="${VID}${r.slug}.jpg" alt="">`;
    b.onclick = () => s.scrollIntoView({ behavior: "smooth" });
    rail.appendChild(b);
  });

  // Tap a phone: sound on for the whole feed (like the app remembers it).
  feed.addEventListener("click", e => {
    const p = e.target.closest(".phone"); if (!p) return;
    unmuted = !unmuted;
    document.querySelectorAll(".phone").forEach(x => x.classList.toggle("unmuted", unmuted));
    document.querySelectorAll("video").forEach(v => v.muted = !unmuted);
  });

  // Play only the reel on screen.
  const slides = [...document.querySelectorAll(".slide")];
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    const v = en.target.querySelector("video"), i = slides.indexOf(en.target);
    if (en.isIntersecting) {
      if (v) { v.muted = !unmuted; v.play().catch(() => {}); }
      [...rail.children].forEach((b, j) => b.classList.toggle("on", j === i - 1));
      document.getElementById("progress").style.width = (i / REELS.length * 100) + "%";
    } else if (v) v.pause();
  }), { root: feed, threshold: .6 });
  slides.forEach(s => io.observe(s));
</script>
</body>
</html>
