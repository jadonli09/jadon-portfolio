<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked In — Contact Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#efe8dc; --paper-2:#e4dccd; --ink:#1d1a16; --muted:#6d655a; --grease:#d8352a; --film:#151311; }
  * { box-sizing:border-box; margin:0; }
  html, body { overflow-x:clip; }
  body { background:var(--paper); color:var(--ink); font-family:Inter,sans-serif;
    background-image:radial-gradient(#0000000a 1px, transparent 1px); background-size:4px 4px; }

  header { max-width:1200px; margin:0 auto; padding:72px 24px 40px; display:grid; grid-template-columns:1fr auto; align-items:end; gap:24px; }
  h1 { font-family:"Instrument Serif"; font-weight:400; font-size:clamp(56px,9vw,128px); line-height:.9; letter-spacing:-.02em; }
  h1 i { color:var(--grease); }
  header p { font-size:18px; color:var(--muted); max-width:340px; line-height:1.5; }

  /* The film strip — horizontal, sprockets top and bottom */
  .strip-wrap { position:relative; }
  .strip { display:flex; gap:0; overflow-x:auto; scroll-snap-type:x proximity; background:var(--film); padding:34px 24px; scrollbar-width:thin; scrollbar-color:#444 var(--film); transform:rotate(-1.2deg); margin:12px -20px 0; box-shadow:0 18px 40px -18px #0008; }
  .strip::before, .strip::after { content:""; position:absolute; left:0; right:0; height:14px;
    background:repeating-linear-gradient(90deg, transparent 0 10px, var(--paper) 10px 22px, transparent 22px 32px); opacity:.85; }
  .strip::before { top:10px; } .strip::after { bottom:10px; }
  .frame { flex:0 0 auto; position:relative; padding:0 10px; scroll-snap-align:center; cursor:pointer; background:none; border:0; }
  .frame img { height:300px; aspect-ratio:9/16; object-fit:cover; display:block; filter:saturate(.9) contrast(1.05); transition:filter .25s, transform .25s; }
  .frame:hover img { filter:none; transform:translateY(-4px); }
  .frame .no { position:absolute; bottom:8px; left:18px; color:#e9c46a; background:#151311d9; padding:3px 8px; border-radius:3px; font-family:Inter; font-size:14px; letter-spacing:.04em; }
  .frame.on img { outline:3px solid #e9c46a; outline-offset:3px; }
  /* grease-pencil circle on the top three */
  .frame svg { position:absolute; inset:-18px -8px; width:calc(100% + 16px); height:calc(100% + 36px); pointer-events:none; }

  /* Lightbox table */
  .table { max-width:1200px; margin:90px auto 0; padding:0 24px 120px; display:grid; grid-template-columns:minmax(0,420px) 1fr; gap:clamp(32px,6vw,96px); align-items:start; }
  .loupe { position:relative; aspect-ratio:9/16; border-radius:6px; overflow:hidden; background:#000;
    box-shadow:0 2px 0 #fff8 inset, 0 40px 80px -30px #0007, 0 0 0 14px #fff, 0 0 0 15px #0002; transform:rotate(1deg); cursor:pointer; }
  .loupe video { width:100%; height:100%; object-fit:cover; display:block; }
  .loupe .tap { position:absolute; inset:auto 0 16px; text-align:center; font-family:Caveat; font-size:26px; color:#fff; text-shadow:0 1px 6px #000; transition:opacity .3s; }
  .loupe.live .tap { opacity:0; }

  .note .rank { font-family:"Instrument Serif"; font-size:clamp(96px,12vw,170px); line-height:.8; color:var(--grease); }
  .note h2 { font-family:"Instrument Serif"; font-weight:400; font-size:clamp(40px,5vw,72px); line-height:1; margin-top:16px; }
  .note blockquote { font-family:Caveat; font-size:32px; line-height:1.2; color:var(--muted); margin-top:22px; max-width:560px; }
  .note dl { display:flex; gap:44px; margin-top:34px; flex-wrap:wrap; }
  .note dt { font-size:16px; color:var(--muted); }
  .note dd { font-family:"Instrument Serif"; font-size:48px; line-height:1; margin-top:4px; }
  .note .controls { display:flex; gap:12px; margin-top:40px; flex-wrap:wrap; }
  .btn { min-height:56px; padding:0 24px; font-size:17px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); border-radius:999px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; transition:background .2s,color .2s; font-family:Inter; }
  .btn:hover { background:var(--ink); color:var(--paper); }
  .btn.red { border-color:var(--grease); color:var(--grease); }
  .btn.red:hover { background:var(--grease); color:var(--paper); }

  @media (max-width: 760px) {
    header { grid-template-columns:1fr; padding-top:48px; }
    .frame img { height:200px; }
    .table { grid-template-columns:1fr; margin-top:70px; }
    .loupe { max-width:320px; margin:0 auto; width:100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Twelve frames<br>from a <i>year.</i></h1>
  <p>The best of @li_locked.in, pulled off the roll and ranked by plays. Pick a frame.</p>
</header>

<div class="strip-wrap"><div class="strip" id="strip"></div></div>

<section class="table">
  <div class="loupe" id="loupe">
    <video id="vid" playsinline loop preload="metadata"></video>
    <div class="tap">tap for sound ✎</div>
  </div>
  <div class="note">
    <div class="rank" id="rank"></div>
    <h2 id="title"></h2>
    <blockquote id="cap"></blockquote>
    <dl>
      <div><dt>Plays</dt><dd id="views"></dd></div>
      <div><dt>Likes</dt><dd id="likes"></dd></div>
      <div><dt id="date"></dt><dd id="day"></dd></div>
    </dl>
    <div class="controls">
      <button class="btn" id="prev">← Previous frame</button>
      <button class="btn" id="next">Next frame →</button>
      <a class="btn red" id="ig" target="_blank" rel="noreferrer">Open on Instagram ↗</a>
    </div>
  </div>
</section>

<script src="reels.js"></script>
<script>
  const strip = document.getElementById("strip"), vid = document.getElementById("vid"), loupe = document.getElementById("loupe");
  const circle = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 4 C82 3 97 22 96 50 C95 80 78 97 48 96 C18 95 3 78 4 48 C5 20 22 6 56 6" fill="none" stroke="#d8352a" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".9"/></svg>`;
  let cur = 0;

  REELS.forEach((r, i) => {
    const f = document.createElement("button");
    f.className = "frame";
    f.innerHTML = `<img src="${VID}${r.slug}.jpg" alt="${r.title}"><span class="no">${String(i + 1).padStart(2, "0")}A ▸ ${r.views}</span>${i < 3 ? circle : ""}`;
    f.onclick = () => pick(i, true);
    strip.appendChild(f);
  });

  function pick(i, sound) {
    cur = (i + REELS.length) % REELS.length;
    const r = REELS[cur];
    vid.src = `${VID}${r.slug}.mp4`; vid.poster = `${VID}${r.slug}.jpg`;
    vid.muted = !sound; loupe.classList.toggle("live", !!sound);
    vid.play().catch(() => {});
    rank.textContent = "No. " + (cur + 1);
    title.textContent = r.title;
    cap.textContent = "“" + r.caption + "”";
    views.textContent = r.views; likes.textContent = r.likes;
    date.textContent = r.date; day.textContent = "Day " + r.day;
    ig.href = `https://www.instagram.com/reel/${r.code}/`;
    [...strip.children].forEach((f, j) => f.classList.toggle("on", j === cur));
    strip.children[cur].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }
  loupe.onclick = () => { vid.muted = !vid.muted; loupe.classList.toggle("live", !vid.muted); vid.play(); };
  prev.onclick = () => pick(cur - 1, !vid.muted);
  next.onclick = () => pick(cur + 1, !vid.muted);
  addEventListener("keydown", e => { if (e.key === "ArrowRight") next.click(); if (e.key === "ArrowLeft") prev.click(); });
  pick(0, false);
</script>
</body>
</html>
