    <!-- L -->
    <rect x="16" y="14" width="8.5" height="36"/>
    <rect x="16" y="41.5" width="17" height="8.5"/>
    <!-- I -->
    <rect x="39" y="14" width="8.5" height="36"/>
  </g>
</svg>
